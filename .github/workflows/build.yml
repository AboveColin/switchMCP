name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # Pure-logic tests: the JSON codec and the path policy have no libnx
  # dependency, so they build natively under sanitizers. They cover the code
  # every request passes through, including the traversal checks, and finish in
  # seconds — so they gate the slower cross-build.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C agent/tests/host test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
        working-directory: server
      - run: uv run pytest -q
        working-directory: server

  agent:
    runs-on: ubuntu-latest
    needs: [host-tests]
    # The official devkitPro image; building a sysmodule needs the aarch64
    # toolchain and libnx, which are preinstalled here.
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sysmodule
        run: make -C agent -j"$(nproc)"

      - name: Assemble the SD-card release zip
        run: make -C agent dist

      # Fail loudly if the layout is ever wrong. boot2.flag in particular is
      # what makes Atmosphère start the module at boot — without it the release
      # installs cleanly and then silently does nothing, which is a miserable
      # bug to receive from a user.
      - name: Verify release layout
        run: |
          cd agent
          for f in \
            atmosphere/contents/420000000000AE57/exefs.nsp \
            atmosphere/contents/420000000000AE57/flags/boot2.flag \
            atmosphere/contents/420000000000AE57/toolbox.json \
            config/switch-agentd/config.ini.example
          do
            unzip -l switch-agentd-release.zip | grep -q "$f" \
              || { echo "MISSING FROM RELEASE ZIP: $f"; exit 1; }
          done
          echo "release layout ok"
          sha256sum switch-agentd-release.zip

      - name: Name the artefact after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mv agent/switch-agentd-release.zip \
             "agent/switch-agentd-${GITHUB_REF_NAME}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: switch-agentd
          path: agent/switch-agentd*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: agent/switch-agentd-*.zip
          fail_on_unmatched_files: true
