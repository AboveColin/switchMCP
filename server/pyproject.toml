[project]
name = "switch-mcp"
version = "0.1.0"
description = "MCP server for remote-managing a homebrew Nintendo Switch"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    # Screenshots come off the console as full 1280x720 JPEGs. Downscaling them
    # before they reach the model is the single biggest token saving available,
    # and perceptual hashing lets us skip sending unchanged frames entirely.
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
switch-mcp = "switch_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: spawns a subprocess (tool-group registration checks)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switch_mcp"]
